name: estate_platform
description: Estate Management Platform - Flutter Frontend

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  
  # Navigation
  go_router: ^12.1.3
  
  # Forms & Validation
  # flutter_form_builder: ^9.1.1
  
  # Image Handling
  image_picker: ^1.0.4
  # image_cropper: ^5.0.1
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Utilities
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  
  # Notifications
  flutter_local_notifications: ^16.3.2
  
  # Loading & Animations
  shimmer: ^3.0.0
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
